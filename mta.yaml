_schema-version: 3.3.0
ID: bookshop-backend
description: A simple CAP project.
version: 1.0.0

modules:
  - name: bookshop-backend-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: bookshop-backend-auth
      - name: bookshop-backend-db
      - name: bookshop-backend-destination
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci

  - name: bookshop-backend-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: bookshop-backend-db
    parameters:
      buildpack: nodejs_buildpack

  - name: bookshop-backend-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: bookshop-backend-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - comexamplebooks.zip
          name: comexamplebooks
          target-path: resources/

  - name: comexamplebooks
    type: html5
    path: app/books
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

resources:
  - name: bookshop-backend-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
        role-collections:
          - description: generated
            name: admin (bookshop-backend ${org}-${space})
            role-template-references:
              - $XSAPPNAME.admin
        tenant-mode: dedicated
        xsappname: bookshop-backend-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application

  - name: bookshop-backend-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: bookshop-backend-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-plan: lite

  - name: bookshop-backend-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: bookshop-backend-html5-service
      service-plan: app-host

  - name: bookshop-backend-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production